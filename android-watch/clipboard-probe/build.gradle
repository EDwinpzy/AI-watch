plugins {
    id "com.android.application"
}

android {
    namespace "com.nova.clipboardprobe"
    compileSdk 34

    defaultConfig {
        applicationId "com.nova.clipboardprobe"
        minSdk 31
        targetSdk 31
        versionCode 1
        versionName "1.0-probe"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
